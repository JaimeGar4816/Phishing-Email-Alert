<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #fafafa;
    }

    h1 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #1a1a1a;
    }

    .status {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status.safe {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .status.warning {
      background-color: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
    }

    .status.danger {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .flagged-link {
      background: white;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #d32f2f;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 2px;
    }

    .link-display {
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .link-actual {
      font-size: 11px;
      color: #d32f2f;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      background: #f5f5f5;
      padding: 6px;
      border-radius: 2px;
      margin-top: 6px;
    }

    .link-time {
      font-size: 10px;
      color: #999;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 30px 15px;
      color: #666;
    }

    .empty-state p {
      margin: 8px 0;
      font-size: 13px;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1557b0;
    }

    .footer {
      border-top: 1px solid #e0e0e0;
      margin-top: 15px;
      padding-top: 10px;
      text-align: center;
    }

    .footer a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .detection-reason {
      font-size: 11px;
      color: #d32f2f;
      margin-top: 4px;
      padding-left: 6px;
      border-left: 2px solid #d32f2f;
    }
  </style>
</head>
<body>
  <h1>Phishing Email Alert</h1>
  <div id="status" class="status"></div>
  <div id="links-container"></div>
  <div class="footer">
    <a href="#" id="settingsLink">Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
